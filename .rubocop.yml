inherit_from: .rubocop_todo.yml

AllCops:
  TargetRubyVersion: '2.0'
  SuggestExtensions: false
  NewCops: disable
  Exclude:
    # Setting Exclude here REPLACES RuboCop's default exclude list rather than
    # extending it, so the paths it normally skips have to be restated. Without
    # them RuboCop walks vendor/bundle and loads the .rubocop.yml shipped inside
    # gems there, which pulls in plugins this project does not depend on.
    - 'vendor/**/*'
    - '.gem/**/*'
    - 'node_modules/**/*'
    - '.git/**/*'
    # Standalone cross-SDK test harness: carries its own Gemfile and is absent
    # from the gemspec's spec.files, so it is not held to the gem's style.
    - 'e2e-cli/**/*'

Layout/FirstHashElementIndentation:
  EnforcedStyle: consistent

Metrics/AbcSize:
  Exclude:
    - "spec/**/*.rb"

Metrics/BlockLength:
  Exclude:
    - "spec/**/*.rb"

Metrics/ClassLength:
  Exclude:
    - "spec/**/*.rb"

Metrics/CyclomaticComplexity:
  Exclude:
    - "spec/**/*.rb"

Layout/LineLength:
  Exclude:
    - "spec/**/*.rb"

Metrics/MethodLength:
  Exclude:
    - "spec/**/*.rb"

Metrics/PerceivedComplexity:
  Exclude:
    - "spec/**/*.rb"

Naming/FileName:
  Exclude:
    - lib/analytics-ruby.rb # Gem name, added for easier Gemfile usage

Naming/PredicateName:
  AllowedMethods:
    - is_requesting? # Can't be renamed, backwards compatibility

Style/BlockDelimiters:
  Exclude:
    - 'spec/**/*'

Style/DateTime:
  Exclude:
    - 'spec/**/*.rb'

Style/Documentation:
  Enabled: false

Style/FormatString:
  EnforcedStyle: percent

# Allow one-liner functions to be wrapped in conditionals rather
# than forcing a guard clause
Style/GuardClause:
  MinBodyLength: 2

Style/HashSyntax:
  EnforcedStyle: hash_rockets
  Exclude:
    - 'spec/**/*.rb'

Style/ModuleFunction:
  Enabled: false

Style/MutableConstant:
  Enabled: false

Style/NumericLiterals:
  MinDigits: 6

Style/ParallelAssignment:
  Enabled: false

Style/PreferredHashMethods:
  EnforcedStyle: verbose
