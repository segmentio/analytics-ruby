name: Release

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

env:
  ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}

jobs:
  test:
    name: Verify
    runs-on: ubuntu-x64

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Ruby
        uses: ./.github/actions/setup-ruby
        with:
          ruby-version: '3.3'

      - name: Authenticate with Artifactory
        uses: ./.github/actions/artifactory-oidc
        with:
          artifactory_url: ${{ env.ARTIFACTORY_URL }}

      - name: Install dependencies
        run: bundle install

      - name: Run tests
        run: bundle exec rake

  deploy:
    name: Publish to RubyGems
    runs-on: ubuntu-x64
    needs: [test]
    environment: rubygems
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Ruby
        uses: ./.github/actions/setup-ruby
        with:
          ruby-version: '3.3'

      - name: Build gem
        run: gem build analytics-ruby.gemspec

      - name: Publish to RubyGems (Trusted Publishing)
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1
