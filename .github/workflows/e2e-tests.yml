name: E2E Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      e2e_tests_ref:
        description: 'Branch or ref of sdk-e2e-tests to use'
        required: false
        default: 'main'

permissions:
  id-token: write
  contents: read

env:
  ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}

jobs:
  e2e-tests:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'ubuntu-x64' }}

    steps:
      - name: Checkout SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          path: sdk

      - name: Checkout sdk-e2e-tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: segmentio/sdk-e2e-tests
          ref: ${{ inputs.e2e_tests_ref || 'main' }}
          path: sdk-e2e-tests

      - name: Setup Ruby
        uses: ruby/setup-ruby@a2bbe5b1b236842c1cb7dd11e8e01a7b8b7f2007 # v1
        with:
          ruby-version: '3.3'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run E2E tests
        working-directory: sdk-e2e-tests
        run: |
          ./scripts/run-tests.sh \
            --sdk-dir "${{ github.workspace }}/sdk/e2e-cli" \
            --cli "ruby ${{ github.workspace }}/sdk/e2e-cli/main.rb"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-test-results
          path: sdk-e2e-tests/test-results/
          if-no-files-found: ignore
