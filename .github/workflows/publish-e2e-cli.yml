name: Publish E2E CLI

on:
  push:
    branches: [master]
    paths:
      - 'e2e-cli/**'
      - 'lib/**'
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest-large
    steps:
      - name: Checkout SDK
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74  # v1
        with:
          ruby-version: '3.2'

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp e2e-cli/main.rb artifact/
          cp e2e-cli/e2e-config.json artifact/
          cp e2e-cli/run-e2e.sh artifact/
          cp e2e-cli/Gemfile artifact/
          cp -r lib artifact/lib

      - name: Upload CLI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: e2e-cli-ruby
          path: artifact/
          retention-days: 90
